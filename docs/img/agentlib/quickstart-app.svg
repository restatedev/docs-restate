<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Quickstart weather agent</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6270"/>
    </marker>
  </defs>

  <rect width="960" height="240" rx="12" fill="#ffffff"/>

  <!-- curl -->
  <rect x="20" y="66" width="120" height="48" rx="24" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
  <text x="80" y="90" font-size="19" fill="#2f3340" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">curl</text>

  <!-- Restate Server -->
  <rect x="192" y="34" width="212" height="172" rx="8" fill="#e7e9fb" stroke="#3f45c2" stroke-width="1.5"/>
  <text x="298" y="80" font-size="20" font-weight="600" fill="#3f45c2" text-anchor="middle" dominant-baseline="central">Restate Server</text>
  <g font-size="16" fill="#555a66" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="298" y="114">localhost:8080</text>
    <text x="298" y="140">UI: localhost:9070</text>
  </g>
  <rect x="216" y="160" width="164" height="32" rx="6" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
  <text x="298" y="176" font-size="16" fill="#2f3340" text-anchor="middle" dominant-baseline="central">conversation state</text>

  <!-- Your service -->
  <rect x="456" y="8" width="320" height="224" rx="10" fill="#f7f8fe" stroke="#3f45c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="616" y="32" font-size="17" font-weight="500" fill="#555a66" text-anchor="middle" dominant-baseline="central">Your service on <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">localhost:9080</tspan></text>
  <rect x="484" y="56" width="264" height="68" rx="8" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
  <text x="616" y="77" font-size="17" fill="#2f3340" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent/session-1/run</text>
  <text x="616" y="104" font-size="17" fill="#3f45c2" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">weatherAgent.run()</text>
  <rect x="484" y="160" width="264" height="48" rx="8" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
  <text x="616" y="184" font-size="19" fill="#2f3340" text-anchor="middle" dominant-baseline="central"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3f45c2">getWeather</tspan> tool</text>

  <!-- OpenAI -->
  <rect x="812" y="66" width="128" height="48" rx="8" fill="#ffffff" stroke="#c4c7d0" stroke-width="1.5"/>
  <text x="876" y="90" font-size="19" fill="#2f3340" text-anchor="middle" dominant-baseline="central">OpenAI</text>

  <!-- Arrows, drawn last so that they stay on top of the service box -->
  <g stroke="#5d6270" stroke-width="1.5" fill="none">
    <line x1="140" y1="90" x2="190" y2="90" marker-end="url(#arrow)"/>
    <line x1="404" y1="90" x2="482" y2="90" marker-end="url(#arrow)"/>
    <line x1="616" y1="126" x2="616" y2="158" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="750" y1="90" x2="810" y2="90" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
</svg>
