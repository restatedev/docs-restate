<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>agentlib request flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6270"/>
    </marker>
  </defs>

  <rect width="960" height="320" rx="12" fill="#ffffff"/>

  <!-- Clients -->
  <g font-size="19" fill="#2f3340" text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="48" width="152" height="44" rx="22" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
    <text x="96" y="70">HTTP client</text>
    <rect x="20" y="108" width="152" height="44" rx="22" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
    <text x="96" y="130">SDK client</text>
    <rect x="20" y="168" width="152" height="44" rx="22" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
    <text x="96" y="190">Webhook</text>
    <rect x="20" y="228" width="152" height="44" rx="22" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
    <text x="96" y="250">Kafka</text>
  </g>

  <!-- Restate Server -->
  <rect x="236" y="48" width="184" height="224" rx="8" fill="#e7e9fb" stroke="#3f45c2" stroke-width="1.5"/>
  <text x="328" y="160" font-size="20" font-weight="600" fill="#3f45c2" text-anchor="middle" dominant-baseline="central">Restate Server</text>

  <!-- Your service -->
  <rect x="476" y="12" width="284" height="296" rx="10" fill="#f7f8fe" stroke="#3f45c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="618" y="40" font-size="17" font-weight="500" fill="#555a66" text-anchor="middle" dominant-baseline="central">Your service</text>
  <rect x="508" y="64" width="220" height="192" rx="8" fill="#ffffff" stroke="#a3a8e8" stroke-width="1.5"/>
  <text x="618" y="145" font-size="20" fill="#2f3340" text-anchor="middle" dominant-baseline="central">handler</text>
  <text x="618" y="175" font-size="19" fill="#3f45c2" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.run()</text>

  <!-- LLM, tools, and sandbox -->
  <g font-size="19" fill="#2f3340" text-anchor="middle" dominant-baseline="central">
    <rect x="812" y="78" width="128" height="44" rx="8" fill="#ffffff" stroke="#c4c7d0" stroke-width="1.5"/>
    <text x="876" y="100">LLM</text>
    <rect x="812" y="138" width="128" height="44" rx="8" fill="#ffffff" stroke="#c4c7d0" stroke-width="1.5"/>
    <text x="876" y="160">Tools</text>
    <rect x="812" y="198" width="128" height="44" rx="8" fill="#ffffff" stroke="#c4c7d0" stroke-width="1.5"/>
    <text x="876" y="220">Sandbox</text>
  </g>

  <!-- Arrows, drawn last so that they stay on top of the service box -->
  <g stroke="#5d6270" stroke-width="1.5" fill="none">
    <!-- Clients to the Restate Server -->
    <line x1="172" y1="70" x2="234" y2="70" marker-end="url(#arrow)"/>
    <line x1="172" y1="130" x2="234" y2="130" marker-end="url(#arrow)"/>
    <line x1="172" y1="190" x2="234" y2="190" marker-end="url(#arrow)"/>
    <line x1="172" y1="250" x2="234" y2="250" marker-end="url(#arrow)"/>
    <!-- Restate Server to the handler -->
    <line x1="420" y1="160" x2="506" y2="160" marker-end="url(#arrow)"/>
    <!-- Handler to the LLM, tools, and sandbox -->
    <line x1="730" y1="100" x2="810" y2="100" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="730" y1="160" x2="810" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="730" y1="220" x2="810" y2="220" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
</svg>
